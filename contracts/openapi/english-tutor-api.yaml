openapi: 3.1.0
info:
  title: English Tutor Agent API
  version: 1.0.0-draft
  description: |
    Initial machine-readable contract aligned with the PRD and design baseline.
    The contract is intentionally focused on P0/P1 user flows and must evolve
    through reviewed changes.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
  - name: Profile
  - name: Assessment
  - name: Planning
  - name: Training
  - name: Conversation
  - name: Audio
  - name: IELTS
  - name: Privacy
  - name: Quota
  - name: Admin
  - name: Admin AI Providers

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a learner account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access token
      operationId: refresh
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refreshed authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh session
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logged out

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      summary: Get SaaS administration dashboard metrics
      operationId: getAdminDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: Search users for SaaS administration
      operationId: searchAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
        - name: role
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/users/{userKey}:
    get:
      tags: [Admin]
      summary: Get a user administration detail
      operationId: getAdminUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserKeyPath'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/users/{userKey}/status:
    patch:
      tags: [Admin]
      summary: Enable or disable a user
      operationId: updateAdminUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserStatusRequest'
      responses:
        '200':
          description: Updated user detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/users/{userKey}/roles:
    put:
      tags: [Admin]
      summary: Replace user roles
      operationId: replaceAdminUserRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRolesRequest'
      responses:
        '200':
          description: Updated user detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/users/{userKey}/quota-policy:
    put:
      tags: [Admin]
      summary: Update a user's effective quota policy
      operationId: updateAdminQuotaPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminQuotaPolicyRequest'
      responses:
        '200':
          description: Updated quota state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuotaState'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/users/{userKey}/quota/reset-today:
    post:
      tags: [Admin]
      summary: Reset today's quota usage for a user
      operationId: resetAdminUserQuotaToday
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserKeyPath'
      responses:
        '200':
          description: Updated quota state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuotaState'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/users/{userKey}/quota/bonus:
    post:
      tags: [Admin]
      summary: Add quota bonus for a user today
      operationId: addAdminUserQuotaBonus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminQuotaBonusRequest'
      responses:
        '200':
          description: Updated quota state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuotaState'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/settings:
    get:
      tags: [Admin]
      summary: List runtime system settings
      operationId: listAdminSystemSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSystemSetting'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/settings/{key}:
    put:
      tags: [Admin]
      summary: Update a runtime system setting
      operationId: updateAdminSystemSetting
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSystemSettingRequest'
      responses:
        '200':
          description: Updated system setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemSetting'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/audit:
    get:
      tags: [Admin]
      summary: List admin audit events
      operationId: listAdminAudit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Admin audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/ai-providers:
    get:
      tags: [Admin AI Providers]
      summary: List runtime AI provider configurations
      operationId: listAiProviders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provider configurations with masked secret state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProvider'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/ai-providers/{providerCode}:
    get:
      tags: [Admin AI Providers]
      summary: Get a runtime AI provider configuration
      operationId: getAiProvider
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
      responses:
        '200':
          description: Provider configuration with masked secret state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Admin AI Providers]
      summary: Upsert a runtime AI provider configuration
      operationId: putAiProvider
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderUpdateRequest'
      responses:
        '200':
          description: Saved provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/admin/ai-providers/{providerCode}/secret:
    put:
      tags: [Admin AI Providers]
      summary: Replace a provider API key
      description: Stores the API key encrypted with AES-GCM and never returns the raw secret.
      operationId: replaceAiProviderSecret
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderSecretRequest'
      responses:
        '200':
          description: Provider configuration with masked secret state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/me/quota:
    get:
      tags: [Quota]
      summary: Get the authenticated learner's daily AI request quota
      operationId: getCurrentQuota
      responses:
        '200':
          description: Current quota state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaStatus'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/profile/primary-goal:
    put:
      tags: [Profile]
      summary: Create or replace the user's only primary learning goal
      operationId: putPrimaryGoal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryGoalRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/profile/preferences:
    put:
      tags: [Profile]
      summary: Save learning and correction preferences
      operationId: putPreferences
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
        '400':
          $ref: '#/components/responses/Problem'

  /api/v1/onboarding/progress:
    get:
      tags: [Profile]
      summary: Get resumable onboarding progress
      operationId: getOnboardingProgress
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgress'

  /api/v1/assessments/self:
    post:
      tags: [Assessment]
      summary: Submit skill self-assessment
      operationId: submitSelfAssessment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAssessmentRequest'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssessmentResponse'

  /api/v1/assessments:
    post:
      tags: [Assessment]
      summary: Start a lightweight adaptive assessment
      operationId: startAssessment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetMinutes:
                  type: integer
                  minimum: 5
                  maximum: 15
                  default: 9
      responses:
        '201':
          description: Assessment started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSession'
        '400':
          description: Invalid target duration or onboarding state

  /api/v1/assessments/{assessmentId}/next:
    get:
      tags: [Assessment]
      summary: Get the next adaptive assessment item
      operationId: getNextAssessmentItem
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: Next item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentItem'
        '204':
          description: No more items

  /api/v1/assessments/{assessmentId}/answers:
    post:
      tags: [Assessment]
      summary: Submit an assessment answer
      operationId: submitAssessmentAnswer
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentAnswerRequest'
      responses:
        '200':
          description: Answer accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerReceipt'
        '400':
          description: Invalid answer, item, or assessment session state
        '429':
          $ref: '#/components/responses/Problem'

  /api/v1/assessments/{assessmentId}/complete:
    post:
      tags: [Assessment]
      summary: Complete the assessment and generate an initial learner profile
      operationId: completeAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Completion accepted
          content:
            application/json:
              schema:
                type: object
                required: [assessmentId, status]
                properties:
                  assessmentId:
                    type: string
                  status:
                    type: string
                    enum: [PROCESSING, COMPLETED]

  /api/v1/assessments/{assessmentId}/result:
    get:
      tags: [Assessment]
      summary: Get assessment result
      operationId: getAssessmentResult
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'

  /api/v1/plans/today:
    get:
      tags: [Planning]
      summary: Get or generate today's personalized plan
      operationId: getTodayPlan
      responses:
        '200':
          description: Today's plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'

  /api/v1/plans/today/adjustments:
    post:
      tags: [Planning]
      summary: Temporarily adjust today's plan without replacing long-term goals
      operationId: adjustTodayPlan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAdjustmentRequest'
      responses:
        '200':
          description: Adjusted plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'

  /api/v1/training-sessions:
    post:
      tags: [Training]
      summary: Start a training session from a plan
      operationId: startTrainingSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTrainingSessionRequest'
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        '400':
          description: Invalid plan, onboarding state, mode, or idempotency key

  /api/v1/training-sessions/{sessionId}:
    get:
      tags: [Training]
      summary: Get a training session
      operationId: getTrainingSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Training session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        '400':
          description: Session not found for the user

  /api/v1/training-sessions/{sessionId}/pause:
    post:
      tags: [Training]
      summary: Pause an active training session
      operationId: pauseTrainingSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Paused session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        '400':
          description: Invalid session state or ownership

  /api/v1/training-sessions/{sessionId}/resume:
    post:
      tags: [Training]
      summary: Resume a paused training session
      operationId: resumeTrainingSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Resumed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        '400':
          description: Invalid session state or ownership

  /api/v1/training-sessions/{sessionId}/complete:
    post:
      tags: [Training]
      summary: Complete a training session
      operationId: completeTrainingSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Completed session with deterministic daily summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionCompletion'
        '400':
          description: Invalid session state or ownership

  /api/v1/training-sessions/{sessionId}/current-task:
    get:
      tags: [Training]
      summary: Get the current task for a training session
      operationId: getCurrentTrainingTask
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Current training task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentTrainingTask'
        '400':
          description: Session has no current task or is not owned by the user

  /api/v1/training-sessions/{sessionId}/tasks/{taskId}/attempts:
    post:
      tags: [Training]
      summary: Submit a text task attempt
      operationId: submitTaskAttempt
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAttemptRequest'
      responses:
        '202':
          description: Attempt accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAttemptReceipt'
        '400':
          description: Invalid session state, task ownership, idempotency key, text payload, or unsupported input type

  /api/v1/conversations/{sessionId}/messages/stream:
    post:
      tags: [Conversation]
      summary: Send a text message and receive server-sent events
      operationId: streamConversationMessage
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageRequest'
      responses:
        '200':
          description: >
            M2-T04 single-request SSE stream. Emits `status`, one or more
            `text_delta`, `correction_ready`, and `done` in order.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                basic:
                  value: |
                    id: 1
                    event: status
                    data: {"stage":"THINKING","message":"正在理解你的表达..."}

                    id: 2
                    event: text_delta
                    data: {"delta":"This is "}

                    id: 3
                    event: correction_ready
                    data: {"hasError":true,"corrections":[{"original":"very like","corrected":"really like","errorType":"word_order","severity":"MEDIUM","explanationZh":"Use 'really' before verbs like 'like'; 'very' usually modifies adjectives.","shouldInterrupt":false,"memoryWorthy":true,"naturalSuggestions":[{"sentence":"I really like it.","style":"NEUTRAL"}]}],"overallFeedback":"Good communication. Focus on these small fixes while continuing the exchange.","promptVersion":"correction-analyzer-v1","schemaVersion":"correction-result-v1","traceId":"correction-...","providerId":"openai","modelId":"configured-chat-model"}

                    id: 4
                    event: done
                    data: {"traceId":"conversation-...","providerId":"openai","modelId":"configured-chat-model"}
        '400':
          description: Invalid session state, ownership, idempotency key, message type, task id, or text payload
        '429':
          $ref: '#/components/responses/Problem'

  /api/v1/audio/uploads:
    post:
      tags: [Audio]
      summary: Create a presigned upload for user audio
      operationId: createAudioUpload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, sizeBytes, durationMs, purpose]
              properties:
                contentType:
                  type: string
                  enum: [audio/wav, audio/m4a, audio/mp4, audio/ogg]
                sizeBytes:
                  type: integer
                  minimum: 1
                  maximum: 52428800
                durationMs:
                  type: integer
                  minimum: 100
                  maximum: 600000
                purpose:
                  type: string
                  enum: [ASSESSMENT, TRAINING, IELTS]
      responses:
        '201':
          description: Upload reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadReservation'

  /api/v1/profile/learner-summary:
    get:
      tags: [Profile]
      summary: Get a simplified learner profile and trends
      operationId: getLearnerSummary
      responses:
        '200':
          description: Learner summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSummary'

  /api/v1/ielts/simulations:
    post:
      tags: [IELTS]
      summary: Start IELTS Speaking Part 1, 2, 3 or a full simulation
      operationId: startIeltsSimulation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [PART_1, PART_2, PART_3, FULL]
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [simulationId, mode, status]
                properties:
                  simulationId:
                    type: string
                  mode:
                    type: string
                  status:
                    type: string

  /api/v1/settings/privacy:
    get:
      tags: [Privacy]
      summary: Get privacy settings
      operationId: getPrivacySettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
    put:
      tags: [Privacy]
      summary: Update privacy settings
      operationId: putPrivacySettings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettings'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'

  /api/v1/data-privacy/deletion-requests:
    post:
      tags: [Privacy]
      summary: Request deletion of learner data
      operationId: createDeletionRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [requestId, status]
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                    enum: [PENDING, PROCESSING, COMPLETED, FAILED]

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    UserKeyPath:
      name: userKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ProviderCode:
      name: providerCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9._-]{1,64}$'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    AuthRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: [string, 'null']

    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, accessToken, expiresIn]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          minimum: 1

    UserResponse:
      type: object
      additionalProperties: false
      required: [userKey, email, status, roles, locale, timezone]
      properties:
        userKey:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        locale:
          type: string
        timezone:
          type: string

    PrimaryGoalRequest:
      type: object
      additionalProperties: false
      required: [goal]
      properties:
        goal:
          type: string
          enum: [WORKPLACE, GENERAL, IELTS]

    PreferenceRequest:
      type: object
      additionalProperties: false
      required: [dailyMinutes, correctionStyle, reminderEnabled, saveRawText, saveRawAudio]
      properties:
        dailyMinutes:
          type: integer
          enum: [5, 10, 20, 30, 45]
        correctionStyle:
          type: string
          enum: [LIGHT, STANDARD, STRICT]
          enum: [LIGHT, STANDARD, STRICT]
        reminderEnabled:
          type: boolean
        saveRawText:
          type: boolean
        saveRawAudio:
          type: boolean

    ProfileSummary:
      type: object
      required: [primaryGoal, dailyMinutes, correctionStyle]
      properties:
        primaryGoal:
          type: string
          enum: [WORKPLACE, GENERAL, IELTS]
        dailyMinutes:
          type: integer
        correctionStyle:
          type: string
        onboardingCompleted:
          type: boolean

    OnboardingProgress:
      type: object
      required: [step, completed]
      properties:
        step:
          type: string
          enum: [GOAL, PREFERENCES, SELF_ASSESSMENT, ASSESSMENT, RESULT, COMPLETE]
        completed:
          type: boolean
        assessmentId:
          type: [string, 'null']

    SelfAssessmentRequest:
      type: object
      additionalProperties: false
      required: [listening, speaking, reading, writing]
      properties:
        listening:
          $ref: '#/components/schemas/SelfRating'
        speaking:
          $ref: '#/components/schemas/SelfRating'
        reading:
          $ref: '#/components/schemas/SelfRating'
        writing:
          $ref: '#/components/schemas/SelfRating'

    SelfRating:
      type: string
      enum: [BEGINNER, BASIC, INTERMEDIATE, UPPER_INTERMEDIATE, ADVANCED]

    SelfAssessmentResponse:
      type: object
      required: [selfAssessmentId, estimatedBand]
      properties:
        selfAssessmentId:
          type: string
        estimatedBand:
          type: string

    AssessmentSession:
      type: object
      required: [assessmentId, status, targetMinutes]
      properties:
        assessmentId:
          type: string
        status:
          type: string
          enum: [IN_PROGRESS, PAUSED, PROCESSING, COMPLETED]
        targetMinutes:
          type: integer
        estimatedRemainingMinutes:
          type: integer

    AssessmentItem:
      type: object
      required: [itemId, skill, type, prompt]
      properties:
        itemId:
          type: string
        skill:
          type: string
          enum: [LISTENING, SPEAKING, READING, WRITING]
        type:
          type: string
          enum: [MULTIPLE_CHOICE, SHORT_TEXT, AUDIO_RESPONSE, REPEAT, RETELL]
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
        audioAssetId:
          type: [string, 'null']
        timeLimitSeconds:
          type: [integer, 'null']

    AssessmentAnswerRequest:
      type: object
      additionalProperties: false
      required: [itemId, answerType]
      properties:
        itemId:
          type: string
        answerType:
          type: string
          enum: [OPTION, TEXT, AUDIO]
        option:
          type: [string, 'null']
        text:
          type: [string, 'null']
        audioAssetId:
          type: [string, 'null']
        clientDurationMs:
          type: [integer, 'null']

    AnswerReceipt:
      type: object
      required: [answerId, accepted]
      properties:
        answerId:
          type: string
        accepted:
          type: boolean

    AssessmentResult:
      type: object
      required: [assessmentId, overallLevel, skills, confidence, summaryZh, strengths, priorities]
      properties:
        assessmentId:
          type: string
        overallLevel:
          type: string
        skills:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SkillScore'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        summaryZh:
          type: string
        strengths:
          type: array
          items:
            type: string
        priorities:
          type: array
          items:
            type: string
        recommendedStartingDifficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]

    SkillScore:
      type: object
      required: [score, level, confidence, evidence]
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        level:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 300

    LearningPlan:
      type: object
      required: [planId, date, totalMinutes, tasks, reasons]
      properties:
        planId:
          type: string
        date:
          type: string
          format: date
        totalMinutes:
          type: integer
        tasks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlanTask'
        reasons:
          type: array
          items:
            type: string
        temporaryAdjustment:
          type: boolean

    PlanTask:
      type: object
      required: [taskId, type, title, durationMinutes, skillFocus, difficulty]
      properties:
        taskId:
          type: string
        type:
          type: string
          enum: [REVIEW, LISTENING, SPEAKING, READING, WRITING, CONVERSATION, IELTS, SUMMARY]
        title:
          type: string
        durationMinutes:
          type: integer
        skillFocus:
          type: array
          items:
            type: string
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        reason:
          type: string

    PlanAdjustmentRequest:
      type: object
      additionalProperties: false
      properties:
        availableMinutes:
          type: integer
          enum: [5, 10, 20, 30, 45]
        preferredSkill:
          type: [string, 'null']
        temporaryScenario:
          type: [string, 'null']
        textOnly:
          type: boolean

    TrainingSession:
      type: object
      required: [sessionId, planId, type, mode, status, currentTaskId, startedAt, effectiveSeconds]
      properties:
        sessionId:
          type: string
        planId:
          type: string
        type:
          type: string
          enum: [DAILY, FREE_CONVERSATION, REVIEW, IELTS]
        mode:
          type: string
          enum: [TEXT, VOICE, MIXED]
        status:
          type: string
          enum: [CREATED, IN_PROGRESS, PAUSED, COMPLETING, COMPLETED, COMPLETION_FAILED, CANCELLED]
        currentTaskId:
          type: string
        startedAt:
          type: string
          format: date-time
        pausedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        effectiveSeconds:
          type: integer
          minimum: 0

    TrainingSessionCompletion:
      type: object
      required: [session, dailySummary]
      properties:
        session:
          $ref: '#/components/schemas/TrainingSession'
        dailySummary:
          $ref: '#/components/schemas/DailyTrainingSummary'

    DailyTrainingSummary:
      type: object
      additionalProperties: false
      required: [sessionId, completedTaskCount, evidenceCount, practicedSkills, highlights, memorableItems, nextFocus, generatedAt]
      properties:
        sessionId:
          type: string
        completedTaskCount:
          type: integer
          minimum: 1
        evidenceCount:
          type: integer
          minimum: 1
        practicedSkills:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        highlights:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        memorableItems:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        nextFocus:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        generatedAt:
          type: string
          format: date-time

    StartTrainingSessionRequest:
      type: object
      additionalProperties: false
      required: [planId]
      properties:
        planId:
          type: string
        mode:
          type: [string, 'null']
          enum: [TEXT, VOICE, MIXED, null]

    CurrentTrainingTask:
      type: object
      required: [taskId, type, title, durationMinutes, skillFocus, difficulty, reason, status]
      properties:
        taskId:
          type: string
        type:
          type: string
        title:
          type: string
        durationMinutes:
          type: integer
        skillFocus:
          type: array
          items:
            type: string
        difficulty:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [READY, STARTED, COMPLETED, SKIPPED]

    TaskAttemptRequest:
      type: object
      additionalProperties: false
      required: [inputType]
      properties:
        inputType:
          type: string
          enum: [TEXT, AUDIO, OPTION]
        text:
          type: [string, 'null']
          minLength: 1
          maxLength: 4000
        audioAssetId:
          type: [string, 'null']
        option:
          type: [string, 'null']
        hintLevel:
          type: [integer, 'null']
          minimum: 0
          maximum: 4
        clientDurationMs:
          type: [integer, 'null']
          minimum: 0
          maximum: 7200000
        clientStartedAt:
          type: [string, 'null']
          format: date-time
        clientCompletedAt:
          type: [string, 'null']
          format: date-time

    TaskAttemptReceipt:
      type: object
      required: [attemptId, status, feedbackAvailable, evidenceCount]
      properties:
        attemptId:
          type: string
        status:
          type: string
          enum: [ACCEPTED, PROCESSING, COMPLETED, FAILED]
        feedbackAvailable:
          type: boolean
        evidenceCount:
          type: integer
          minimum: 0

    ConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [messageType, text]
      properties:
        messageType:
          type: string
          enum: [TEXT, AUDIO]
        text:
          type: string
          minLength: 1
          maxLength: 4000
        taskId:
          type: [string, 'null']

    AudioUploadReservation:
      type: object
      required: [uploadId, uploadUrl, expiresAt]
      properties:
        uploadId:
          type: string
        uploadUrl:
          type: string
          format: uri
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time

    LearnerSummary:
      type: object
      required: [overallLevel, strengths, currentPriorities, trends]
      properties:
        overallLevel:
          type: string
        strengths:
          type: array
          items:
            type: string
        currentPriorities:
          type: array
          items:
            type: string
        trends:
          type: object
          additionalProperties:
            type: number

    PrivacySettings:
      type: object
      additionalProperties: false
      required: [saveRawText, saveRawAudio]
      properties:
        saveRawText:
          type: boolean
        saveRawAudio:
          type: boolean
        rawAudioRetentionDays:
          type: integer
          minimum: 0
          maximum: 365

    QuotaStatus:
      type: object
      additionalProperties: false
      required: [quotaDate, dailyLimit, used, bonus, remaining, unlimited, resetAt]
      properties:
        quotaDate:
          type: string
          format: date
        dailyLimit:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
        bonus:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        unlimited:
          type: boolean
        resetAt:
          type: string
          format: date-time

    AdminDashboardSummary:
      type: object
      additionalProperties: false
      required:
        - totalUsers
        - activeUsersToday
        - newUsersToday
        - aiRequestsToday
        - usersReachedQuotaLimit
        - activeDefaultProvider
      properties:
        totalUsers:
          type: integer
          format: int64
          minimum: 0
        activeUsersToday:
          type: integer
          format: int64
          minimum: 0
        newUsersToday:
          type: integer
          format: int64
          minimum: 0
        aiRequestsToday:
          type: integer
          format: int64
          minimum: 0
        usersReachedQuotaLimit:
          type: integer
          format: int64
          minimum: 0
        activeDefaultProvider:
          type: string

    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    AdminUserSummary:
      type: object
      additionalProperties: false
      required: [userId, userKey, email, status, roles, createdAt]
      properties:
        userId:
          type: integer
          format: int64
        userKey:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, 'null']
          format: date-time

    AdminUserDetail:
      type: object
      additionalProperties: false
