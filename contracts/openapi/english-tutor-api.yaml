        providerType:
          type: string
          enum: [OPENAI]
        displayName:
          type: string
        enabled:
          type: boolean
        defaultLlm:
          type: boolean
        defaultAsr:
          type: boolean
        defaultTts:
          type: boolean
        baseUrl:
          type: string
          format: uri
        llmModel:
          type: string
        asrModel:
          type: string
        ttsModel:
          type: string
        ttsVoice:
          type: string
        timeoutSeconds:
          type: integer
          minimum: 1
        apiKeyConfigured:
          type: boolean
        apiKeyMaskedHint:
          type: [string, 'null']

    AiProviderUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - providerType
        - displayName
        - enabled
        - defaultLlm
        - defaultAsr
        - defaultTts
        - baseUrl
        - llmModel
        - asrModel
        - ttsModel
        - ttsVoice
      properties:
        providerType:
          type: string
          enum: [OPENAI]
        displayName:
          type: string
          minLength: 1
        enabled:
          type: boolean
        defaultLlm:
          type: boolean
        defaultAsr:
          type: boolean
        defaultTts:
          type: boolean
        baseUrl:
          type: string
          format: uri
        llmModel:
          type: string
          minLength: 1
        asrModel:
          type: string
          minLength: 1
        ttsModel:
          type: string
          minLength: 1
        ttsVoice:
          type: string
          minLength: 1
        timeoutSeconds:
          type: integer
          minimum: 1

    AiProviderSecretRequest:
      type: object
      additionalProperties: false
      required: [apiKey]
      properties:
        apiKey:
          type: string
          minLength: 1

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
