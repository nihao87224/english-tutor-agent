        - userId
        - userKey
        - email
        - status
        - locale
        - timezone
        - authVersion
        - roles
        - authorities
        - createdAt
        - updatedAt
      properties:
        userId:
          type: integer
          format: int64
        userKey:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        locale:
          type: string
        timezone:
          type: string
        authVersion:
          type: integer
          format: int64
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        authorities:
          type: array
          uniqueItems: true
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        disabledAt:
          type: [string, 'null']
          format: date-time

    AdminUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, DISABLED]

    AdminUserRolesRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string

    AdminQuotaPolicyRequest:
      type: object
      additionalProperties: false
      required: [unlimited]
      properties:
        dailyLimitOverride:
          type: [integer, 'null']
          minimum: 0
        unlimited:
          type: boolean

    AdminQuotaBonusRequest:
      type: object
      additionalProperties: false
      required: [bonus]
      properties:
        bonus:
          type: integer
          minimum: 1

    AdminQuotaState:
      type: object
      additionalProperties: false
      required:
        - userKey
        - unlimited
        - quotaDate
        - dailyLimit
        - used
        - reserved
        - bonus
        - remaining
      properties:
        userKey:
          type: string
        dailyLimitOverride:
          type: [integer, 'null']
          minimum: 0
        unlimited:
          type: boolean
        quotaDate:
          type: string
          format: date
        dailyLimit:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        bonus:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0

    AdminSystemSetting:
      type: object
      additionalProperties: false
      required: [key, value, valueType, description, updatedAt]
      properties:
        key:
          type: string
        value:
          type: string
        valueType:
          type: string
          enum: [STRING, INTEGER, BOOLEAN, JSON]
        description:
          type: string
        updatedAt:
          type: string
          format: date-time

    AdminSystemSettingRequest:
      type: object
      additionalProperties: false
      required: [value, valueType]
      properties:
        value:
          type: string
        valueType:
          type: string
          enum: [STRING, INTEGER, BOOLEAN, JSON]
        description:
          type: string

    AdminAuditPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditEntry'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    AdminAuditEntry:
      type: object
      additionalProperties: false
      required: [id, actionCode, targetType, targetKey, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actorUserId:
          type: [integer, 'null']
          format: int64
        actorEmail:
          type: [string, 'null']
          format: email
        actionCode:
          type: string
        targetType:
          type: string
        targetKey:
          type: string
        createdAt:
          type: string
          format: date-time

    AiProvider:
      type: object
      additionalProperties: false
