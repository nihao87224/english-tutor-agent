        - providerCode
        - providerType
        - displayName
        - enabled
        - defaultLlm
        - defaultAsr
        - defaultTts
        - baseUrl
        - llmModel
        - asrModel
        - ttsModel
        - ttsVoice
        - timeoutSeconds
        - apiKeyConfigured
      properties:
        providerCode:
