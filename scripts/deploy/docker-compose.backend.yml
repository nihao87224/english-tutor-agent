services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in current-image.env}
    container_name: english-tutor-backend
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - /opt/english-tutor-agent/shared/production.env

    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8080"

    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s