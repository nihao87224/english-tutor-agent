:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {

}

h2 {

}

h3,

h5,

}

b,
strong,
th {

}

code:not(pre code) {

  padding: 1px 6px;

  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,

  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;

  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #eta-prototype * { box-sizing: border-box; }
    #eta-prototype button,
    #eta-prototype select { font: inherit; }

    #eta-prototype .eta-window {
      min-height: 760px;
      overflow: hidden;
      background: var(--eta-canvas);
      border: 1px solid var(--eta-line);
      border-radius: 18px;
      box-shadow: 0 18px 48px var(--eta-shadow);
    }

    #eta-prototype .eta-topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 66px;
      padding: 12px 22px;
      background: var(--eta-shell);
      border-bottom: 1px solid var(--eta-line);
    }

    #eta-prototype .eta-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      font-weight: 500;
    }

    #eta-prototype .eta-logo {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--eta-brand);
      color: var(--eta-brand-ink);
    }

    #eta-prototype .eta-mode-label {
      margin-left: auto;
      color: var(--eta-subtle);
    }

    #eta-prototype .eta-profile-select {
      min-width: 240px;
      padding: 9px 34px 9px 12px;
      color: var(--eta-ink);
      background: var(--eta-panel-soft);
      border: 1px solid var(--eta-line);
      border-radius: 10px;
    }

    #eta-prototype .eta-layout {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      min-height: 694px;
    }

    #eta-prototype .eta-sidebar {
      padding: 22px 14px;
      background: var(--eta-shell);
      border-right: 1px solid var(--eta-line);
    }

    #eta-prototype .eta-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 20px;
    }

    #eta-prototype .eta-user-avatar {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      background: var(--eta-brand-soft);
      color: var(--eta-brand);
      font-weight: 500;
    }

    #eta-prototype .eta-user-meta span { display: block; }
    #eta-prototype .eta-user-meta span:last-child { color: var(--eta-subtle); }

    #eta-prototype .eta-nav {
      display: grid;
      gap: 5px;
    }

    #eta-prototype .eta-nav button {
      width: 100%;
      padding: 10px 12px;
      text-align: left;
      color: var(--eta-subtle);
      background: transparent;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    #eta-prototype .eta-nav button[aria-current=&quot;page&quot;] {
      color: var(--eta-brand);
      background: var(--eta-brand-soft);
      font-weight: 500;
    }

    #eta-prototype .eta-main {
      padding: 24px;
      min-width: 0;
    }

    #eta-prototype .eta-page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    #eta-prototype .eta-page-title { margin: 0 0 6px; font-weight: 500; }
    #eta-prototype .eta-page-subtitle { margin: 0; color: var(--eta-subtle); }

    #eta-prototype .eta-view-tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--eta-panel-soft);
      border-radius: 10px;
    }

    #eta-prototype .eta-view-tabs button {
      padding: 8px 11px;
      color: var(--eta-subtle);
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #eta-prototype .eta-view-tabs button[aria-pressed=&quot;true&quot;] {
      color: var(--eta-ink);
      background: var(--eta-panel);
      box-shadow: 0 2px 8px var(--eta-shadow);
    }

    #eta-prototype .eta-view[hidden] { display: none; }

    #eta-prototype .eta-prescription {
      padding: 22px;
      background: var(--eta-panel);
      border: 1px solid var(--eta-line);
      border-radius: 16px;
    }

    #eta-prototype .eta-prescription-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
    }

    #eta-prototype .eta-eyebrow {
      color: var(--eta-brand);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    #eta-prototype .eta-prescription h2 {
      margin: 7px 0 9px;
      font-weight: 500;
    }

    #eta-prototype .eta-prescription p { margin: 0; color: var(--eta-subtle); }

    #eta-prototype .eta-time {
      flex: 0 0 auto;
      align-self: flex-start;
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--eta-brand);
      background: var(--eta-brand-soft);
      font-weight: 500;
    }

    #eta-prototype .eta-reason {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      margin-top: 18px;
      padding: 14px;
      background: var(--eta-panel-soft);
      border-radius: 12px;
    }

    #eta-prototype .eta-reason-mark {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 50%;
      color: var(--eta-brand-ink);
      background: var(--eta-brand);
      font-weight: 500;
    }

    #eta-prototype .eta-reason strong { display: block; margin-bottom: 4px; font-weight: 500; }
    #eta-prototype .eta-reason span { color: var(--eta-subtle); }

    #eta-prototype .eta-plan-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.8fr);
      gap: 18px;
      margin-top: 18px;
    }

    #eta-prototype .eta-plan-panel,
    #eta-prototype .eta-lin-panel,
    #eta-prototype .eta-feedback-panel,
    #eta-prototype .eta-skill-panel {
      background: var(--eta-panel);
      border: 1px solid var(--eta-line);
      border-radius: 16px;
    }

    #eta-prototype .eta-plan-panel { padding: 8px 18px; }
    #eta-prototype .eta-plan-heading { padding: 13px 0 8px; font-weight: 500; }

    #eta-prototype .eta-task {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 0;
      text-align: left;
      color: var(--eta-ink);
      background: transparent;
      border: 0;
      border-top: 1px solid var(--eta-line);
      cursor: pointer;
    }

    #eta-prototype .eta-task-index {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      color: var(--eta-brand);
      background: var(--eta-brand-soft);
      font-weight: 500;
    }

    #eta-prototype .eta-task-copy strong,
    #eta-prototype .eta-task-copy span { display: block; }
    #eta-prototype .eta-task-copy strong { margin-bottom: 3px; font-weight: 500; }
    #eta-prototype .eta-task-copy span { color: var(--eta-subtle); }
    #eta-prototype .eta-task-time { color: var(--eta-subtle); }

    #eta-prototype .eta-lin-panel { overflow: hidden; }

    #eta-prototype .eta-lin-visual {
      position: relative;
      min-height: 218px;
      padding: 18px;
      background-image: var(--eta-active-scene);
      background-position: center;
      background-size: cover;
    }

    #eta-prototype .eta-scene-label {
      position: absolute;
      left: 14px;
      bottom: 14px;
      padding: 6px 9px;
      border-radius: 999px;
      color: var(--eta-brand);
      background: var(--eta-panel);
      box-shadow: 0 3px 12px var(--eta-shadow);
    }

    #eta-prototype .eta-lin-content { padding: 18px; }

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
