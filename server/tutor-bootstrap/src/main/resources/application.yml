spring:
  application:
    name: english-tutor-agent
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:english_tutor}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:english_tutor}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

tutor:
  auth:
    jwt-signing-secret: ${TUTOR_JWT_SIGNING_SECRET}
    access-token-ttl: ${TUTOR_ACCESS_TOKEN_TTL:15m}
    bootstrap-admin:
      enabled: ${TUTOR_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${TUTOR_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${TUTOR_BOOTSTRAP_ADMIN_PASSWORD:}
  ai:
    llm-provider: ${LLM_PROVIDER:openai}
    asr-provider: ${ASR_PROVIDER:openai}
    tts-provider: ${TTS_PROVIDER:openai}
