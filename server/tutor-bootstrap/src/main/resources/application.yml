spring:
  application:
    name: english-tutor-agent
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:english_tutor}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:english_tutor}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: ${TUTOR_AUDIO_MAX_FILE_SIZE:50MB}
      max-request-size: ${TUTOR_AUDIO_MAX_REQUEST_SIZE:51MB}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

tutor:
  auth:
    jwt-signing-secret: ${TUTOR_JWT_SIGNING_SECRET}
    access-token-ttl: ${TUTOR_ACCESS_TOKEN_TTL:15m}
    bootstrap-admin:
      enabled: ${TUTOR_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${TUTOR_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${TUTOR_BOOTSTRAP_ADMIN_PASSWORD:}
  quota:
    default-daily-limit: ${TUTOR_QUOTA_DEFAULT_DAILY_LIMIT:50}
    reset-timezone: ${TUTOR_QUOTA_RESET_TIMEZONE:Asia/Shanghai}
  entitlement:
    decision-cache-ttl: ${TUTOR_ENTITLEMENT_DECISION_CACHE_TTL:30s}
  media:
    public-base-url: ${TUTOR_MEDIA_PUBLIC_BASE_URL:https://cdn.example.invalid/learning-content}
    private-gateway-base-url: ${TUTOR_MEDIA_PRIVATE_GATEWAY_BASE_URL:https://media.example.invalid/access}
    access-signing-secret: ${TUTOR_MEDIA_ACCESS_SIGNING_SECRET:test-only-media-access-signing-secret-change-me}
    access-ttl: ${TUTOR_MEDIA_ACCESS_TTL:10m}
  audio:
    private-storage-root: ${TUTOR_AUDIO_PRIVATE_STORAGE_ROOT:var/private/audio}
    asr-confirmation-threshold: ${TUTOR_AUDIO_ASR_CONFIRMATION_THRESHOLD:0.80}
    retention-initial-delay: ${TUTOR_AUDIO_RETENTION_INITIAL_DELAY:PT5M}
    retention-sweep-delay: ${TUTOR_AUDIO_RETENTION_SWEEP_DELAY:PT15M}
  secret:
    encryption-key: ${TUTOR_SECRET_ENCRYPTION_KEY}
    encryption-key-version: ${TUTOR_SECRET_ENCRYPTION_KEY_VERSION:v1}
