name: baseline-validation

on:
  pull_request:
  push:
    branches: [main, develop/v2.0]

jobs:
  project-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: python scripts/validate_project.py
      - run: docker compose --env-file .env.example config

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify server
        working-directory: server
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode clean verify

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Verify Android debug build
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain --warning-mode all
